# ShopSmart AI - Docker Compose Configuration
# Author: Ivan Sytnik (КН-М524)

services:
  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopsmart-backend
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:3000}
      - OPENAI_TIMEOUT_S=${OPENAI_TIMEOUT_S:-25}
      - REQUEST_DEADLINE_S=${REQUEST_DEADLINE_S:-55}
      - RATE_LIMIT=${RATE_LIMIT:-10/minute}
      - DAILY_GENERATE_CAP=${DAILY_GENERATE_CAP:-200}
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-127.0.0.1}
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - shopsmart-network

  # Frontend Web Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: shopsmart-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - shopsmart-network

networks:
  shopsmart-network:
    driver: bridge
